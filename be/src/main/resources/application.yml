spring:
  application:
    name: cutlet-spring-be
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  config:
    encryption-key: ${APP_CONFIG_ENCRYPTION_KEY:}
  mail:
    from: ${APP_MAIL_FROM:noreply@cutletspring.com}
    from-name: ${APP_MAIL_FROM_NAME:Cutlet Spring Security}
    enabled: ${APP_MAIL_ENABLED:true}

server:
  port: ${BACKEND_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

admin:
  email: ${ADMIN_EMAIL:admin@cutletspring.com}
  password: ${ADMIN_PASSWORD:admin123}
  full-name: ${ADMIN_FULL_NAME:Cutlet Spring Administrator}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:cutlet-spring}

restaurant:
  vat-rate: ${RESTAURANT_VAT_RATE:0.08}
  default-prep-minutes: ${RESTAURANT_DEFAULT_PREP_MINUTES:18}
  capacity-hall: ${RESTAURANT_CAPACITY_HALL:30}
  capacity-counter: ${RESTAURANT_CAPACITY_COUNTER:10}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

