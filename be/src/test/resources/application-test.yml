spring:
  datasource:
    url: jdbc:h2:mem:cutlet_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

cloudinary:
  cloud-name: test-cloud
  api-key: test-key
  api-secret: test-secret
  folder: test-folder

app:
  mail:
    enabled: false
    from: test@cutletspring.com
    from-name: Cutlet Spring Test Security

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

