name: Deploy Backend Service

on:
  push:
    branches:
      - main
    paths:
      - 'be/**'
      - '.github/workflows/deploy-backend.yml'
      - 'docker-compose.prod.yml'
  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: true

env:
  IMAGE_NAME: myapah/cutletspring-backend

jobs:
  test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit Tests
        run: |
          cd be
          chmod +x mvnw
          ./mvnw test -B

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./be
          file: ./be/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: Deploy to XVPS VN
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Sync production docker-compose file to VPS
      - name: Copy docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: "/opt/cutletspring"

      # 2. SSH into VPS, pull image, restart backend, and verify health
      - name: SSH and Restart Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            mkdir -p /opt/cutletspring/be

            # If BACKEND_ENV is set in GitHub Secrets, update .env safely
            if [ -n "${{ secrets.BACKEND_ENV }}" ]; then
              cat << 'EOF' > /opt/cutletspring/be/.env
            ${{ secrets.BACKEND_ENV }}
            EOF
              chmod 600 /opt/cutletspring/be/.env
            fi

            cd /opt/cutletspring

            # Login to Docker Hub on VPS (for private repo access if needed)
            if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            fi

            # Tag existing container image as rollback backup before pulling new image
            CURRENT_IMAGE_ID=$(docker inspect --format='{{.Image}}' cutlet-spring-backend 2>/dev/null || true)
            if [ -n "$CURRENT_IMAGE_ID" ]; then
              docker tag "$CURRENT_IMAGE_ID" ${{ env.IMAGE_NAME }}:previous || true
            fi

            # Pull immutable commit SHA image
            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest

            # Deploy backend with the exact commit SHA tag
            BACKEND_IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }} docker compose -f docker-compose.prod.yml up -d --no-deps backend

            # Health Check Verification Loop
            echo "Waiting for backend healthcheck (/actuator/health)..."
            SUCCESS=0
            for i in $(seq 1 24); do
              HEALTH_STATUS=$(curl -s http://127.0.0.1:8080/actuator/health || true)
              if echo "$HEALTH_STATUS" | grep -q '"status":"UP"'; then
                echo "Backend health check PASSED on attempt $i!"
                SUCCESS=1
                break
              fi
              echo "Waiting for Spring Boot to initialize (attempt $i/24)..."
              sleep 5
            done

            if [ $SUCCESS -ne 1 ]; then
              echo "CRITICAL: Health check FAILED! Checking docker logs..."
              docker logs --tail 50 cutlet-spring-backend || true
              if docker image inspect ${{ env.IMAGE_NAME }}:previous >/dev/null 2>&1; then
                echo "Rolling back to previous working image: ${{ env.IMAGE_NAME }}:previous..."
                BACKEND_IMAGE=${{ env.IMAGE_NAME }}:previous docker compose -f docker-compose.prod.yml up -d --no-deps backend
              fi
              exit 1
            fi

            # Clean up old images while keeping current and previous rollback image
            docker image prune -f
