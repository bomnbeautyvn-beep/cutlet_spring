services:
  # ========================================================
  # Primary Relational Database: PostgreSQL 16
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: cutlet-spring-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cutlet_spring}
      POSTGRES_USER: ${POSTGRES_USER:-cutlet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cutlet_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cutlet_user} -d ${POSTGRES_DB:-cutlet_spring}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cutlet-network

  # ========================================================
  # Backend API Service: Java 21 Spring Boot
  # ========================================================
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: cutlet-spring-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cutlet_spring}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cutlet_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cutlet_password}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-cutlet-spring}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cutletspring.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Cutlet Spring Administrator}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-localhost}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_SMTP_STARTTLS: ${SPRING_MAIL_SMTP_STARTTLS:-true}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-noreply@cutletspring.com}
      APP_MAIL_FROM_NAME: ${APP_MAIL_FROM_NAME:-Cutlet Spring Security}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - cutlet-network

  # ========================================================
  # Frontend Web Client: React 19 + Vite (Nginx SPA)
  # ========================================================
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    container_name: cutlet-spring-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cutlet-network

volumes:
  postgres_data:
    name: cutlet_spring_postgres_data

networks:
  cutlet-network:
    name: cutlet_spring_network
    driver: bridge

