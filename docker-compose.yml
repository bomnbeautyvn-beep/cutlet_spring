services:
  # ========================================================
  # Primary Relational Database: PostgreSQL 16
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: cutlet-spring-postgres
    restart: unless-stopped
    env_file:
      - ./be/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cutlet_spring_db_user} -d $${POSTGRES_DB:-cutlet_spring_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cutlet-network

  # ========================================================
  # Backend API Service: Java 21 Spring Boot
  # ========================================================
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: cutlet-spring-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./be/.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    volumes:
      - backend_backups:/app/backups
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - cutlet-network

  # ========================================================
  # Frontend Web Client: React 19 + Vite (Nginx SPA)
  # ========================================================
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    container_name: cutlet-spring-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    env_file:
      - ./fe/.env
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cutlet-network

volumes:
  postgres_data:
    name: cutlet_spring_postgres_data
  backend_backups:
    name: cutlet_spring_backend_backups

networks:
  cutlet-network:
    name: cutlet_spring_network
    driver: bridge

